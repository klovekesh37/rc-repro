name: tests

on:
  push:
  pull_request:

# One run per ref. Without this, a push on top of a push leaves the first run
# grinding through a 7-minute suite nobody will read.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Read-only. The default token is read-write on `push`, and nothing here needs to
# write anything.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    # test_browser.py starts real uvicorns on real ports. A wedged one held a
    # runner for the account's full 6h default; the suite takes ~7 minutes.
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    env:
      # Makes the extras a HARD requirement rather than a hope -- see the
      # `require-extras` test. Both `importorskip`s below report green while
      # testing nothing, so a silent under-install has to fail loudly somewhere.
      RC_REPRO_REQUIRE_EXTRAS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      # dev+gui: the web/API tests need fastapi + python-multipart, which live in
      # the `gui` extra. With only [dev], tests/test_web.py importorskips itself
      # and CI reports a green "1 skipped" while web/app.py goes untested.
      - run: pip install -e ".[dev,gui,browser]"
      # The browser itself, plus the shared libraries Chromium needs. Without
      # this step tests/test_browser.py skips silently and CI reports green for
      # a GUI nobody rendered -- which is the state that let a same-origin form
      # POST stay broken in every real browser while 570 HTTP tests passed.
      - run: python -m playwright install --with-deps chromium --only-shell
      - run: ruff check .
      - run: pytest -q
