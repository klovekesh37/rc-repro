name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      # dev+gui: the web/API tests need fastapi + python-multipart, which live in
      # the `gui` extra. With only [dev], tests/test_web.py importorskips itself
      # and CI reports a green "1 skipped" while web/app.py goes untested.
      - run: pip install -e ".[dev,gui]"
      - run: ruff check .
      - run: pytest -q
